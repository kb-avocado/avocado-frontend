name: Deploy Frontend to Vercel

# main 브랜치에 코드가 push될 때 실행한다.
# develop -> main PR이 merge되는 경우에도 main에 push가 발생하므로 실행된다.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Vercel 프로젝트를 식별하기 위한 값.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # main 브랜치 소스 코드를 GitHub Actions Runner로 가져온다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Vue/Vite 프로젝트 실행에 사용할 Node.js를 설치한다.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Vercel CLI를 GitHub Actions Runner에 설치한다.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel 프로젝트 설정 및 Production 환경변수를 가져온다.
      - name: Pull Vercel Environment
        run: >
          vercel pull
          --yes
          --environment=production
          --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel Production 환경을 기준으로 빌드한다.
      - name: Build Project
        run: >
          vercel build
          --prod
          --token=${{ secrets.VERCEL_TOKEN }}

      # 이미 빌드된 결과물을 Vercel Production으로 배포한다.
      - name: Deploy to Vercel
        run: >
          vercel deploy
          --prebuilt
          --prod
          --token=${{ secrets.VERCEL_TOKEN }}
